name: Flutter Build & Test

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      pull-requests: write
      contents: read
      
    defaults:
      run:
        working-directory: ./diary_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diary-app-debug
          path: diary_app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Benachrichtige Jules bei Fehlern
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.JULES_NOTIFIER_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '@jules 🚨 **Build oder Tests sind fehlgeschlagen!**\n\nBitte schau dir die [Fehler-Logs in diesem Run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') an und pushe einen Fix für diesen Pull Request.'
            })
